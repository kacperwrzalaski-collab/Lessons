<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nauka Niemieckiego</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================= -->
    <!--        EKRAN STARTOWY     -->
    <!-- ========================= -->
    <div id="screen-auth" class="screen active">

        <div class="card glass">

            <h1>Logowanie / Rejestracja</h1>

            <div class="tabs">
                <button id="tab-login" class="active" onclick="showAuthMode('login')">Logowanie</button>
                <button id="tab-register" onclick="showAuthMode('register')">Rejestracja</button>
            </div>

            <!-- LOGOWANIE -->
            <div id="auth-login" class="auth-section active">
                <input id="login-username" placeholder="Login">
                <input id="login-password" type="password" placeholder="Hasło">
                <button onclick="handleLogin()">Zaloguj</button>
                <p id="login-feedback"></p>
            </div>

            <!-- REJESTRACJA -->
            <div id="auth-register" class="auth-section">
                <input id="register-username" placeholder="Login">
                <input id="register-password" type="password" placeholder="Hasło">
                <button onclick="handleRegister()">Utwórz konto</button>
                <p id="register-feedback"></p>
            </div>

        </div>
    </div>

    <!-- ========================= -->
    <!--        MENU GŁÓWNE        -->
    <!-- ========================= -->
    <div id="screen-menu" class="screen">

        <div class="card glass">

            <h1>Witaj!</h1>
            <p id="welcome-user"></p>

            <button onclick="goToScreen('screen-topics')">Tematy</button>
            <button onclick="goToScreen('screen-achievements')">Osiągnięcia</button>
            <button onclick="goToScreen('screen-ranking')">Ranking</button>
            <button onclick="goToScreen('screen-friends')">Znajomi</button>
            <button onclick="logout()">Wyloguj</button>

        </div>
    </div>

    <!-- ========================= -->
    <!--        TEMATY             -->
    <!-- ========================= -->
    <div id="screen-topics" class="screen">

        <div class="card glass">

            <h2>NIEMIECKI – TŁUMACZENIE SŁÓWEK I ODMIANA</h2>
            <h3>Dostępne lekcje</h3>

            <ul id="lessons-list"></ul>

            <button onclick="goToScreen('screen-menu')">Powrót</button>

        </div>
    </div>

    <!-- ========================= -->
    <!--        LEKCJA             -->
    <!-- ========================= -->
    <div id="screen-lesson" class="screen">

        <div class="card glass">

            <h2 id="lesson-title"></h2>
            <p id="lesson-description"></p>

            <button onclick="goToScreen('screen-modes')">Tryby nauki</button>
            <button onclick="goToScreen('screen-topics')">Powrót</button>

        </div>
    </div>

    <!-- ========================= -->
    <!--        TRYBY NAUKI        -->
    <!-- ========================= -->
    <div id="screen-modes" class="screen">

        <div class="card glass">

            <h2 id="modes-lesson-title"></h2>

            <button onclick="showMode('mode-learn')">Nauka</button>
            <button onclick="showMode('mode-practice')">Praktyka</button>
            <button onclick="showMode('mode-quiz')">Quiz</button>
            <button onclick="showMode('mode-flashcards')">Fiszki</button>

            <!-- NAUKA -->
            <div id="mode-learn" class="mode-section active">
                <ul id="wordList"></ul>
            </div>

            <!-- PRAKTYKA -->
            <div id="mode-practice" class="mode-section">
                <p id="practice-info"></p>
                <input id="practice-pl" placeholder="Tłumaczenie">
                <input id="practice-perf" placeholder="Odmiana">
                <button id="practice-check-btn" onclick="checkPractice()">Sprawdź</button>
                <button id="practice-next-btn" class="hidden" onclick="nextPractice()">Następne</button>
                <p id="practice-feedback"></p>
            </div>

            <!-- QUIZ -->
            <div id="mode-quiz" class="mode-section">
                <p id="quiz-question"></p>
                <div id="quiz-answers"></div>
                <p id="quiz-feedback"></p>
                <button onclick="nextQuiz()">Następne</button>
            </div>

            <!-- FISZKI -->
            <div id="mode-flashcards" class="mode-section">
                <p id="flashcard-word"></p>
                <p id="flashcard-translation" class="hidden"></p>
                <button onclick="toggleFlashcard()">Pokaż / Ukryj</button>
                <button onclick="nextFlashcard()">Następne</button>
            </div>

            <button onclick="goToScreen('screen-lesson')">Powrót</button>

        </div>
    </div>

    <!-- ========================= -->
    <!--        RANKING            -->
    <!-- ========================= -->
    <div id="screen-ranking" class="screen">
        <div class="card glass">
            <h2>Ranking</h2>
            <ul id="ranking-list"></ul>
            <button onclick="goToScreen('screen-menu')">Powrót</button>
        </div>
    </div>

    <!-- ========================= -->
    <!--        OSIĄGNIĘCIA        -->
    <!-- ========================= -->
    <div id="screen-achievements" class="screen">
        <div class="card glass">
            <h2>Osiągnięcia</h2>
            <ul id="achievements-list"></ul>
            <button onclick="goToScreen('screen-menu')">Powrót</button>
        </div>
    </div>

    <!-- ========================= -->
    <!--        ZNAJOMI            -->
    <!-- ========================= -->
    <div id="screen-friends" class="screen">
        <div class="card glass">
            <h2>Znajomi</h2>

            <input id="friend-name" placeholder="Nazwa znajomego">
            <button onclick="addFriend()">Dodaj znajomego</button>

            <ul id="friends-list"></ul>

            <h3>Grupy</h3>
            <input id="group-name" placeholder="Nazwa grupy">
            <button onclick="createGroup()">Utwórz grupę</button>

            <ul id="groups-list"></ul>

            <button onclick="goToScreen('screen-menu')">Powrót</button>
        </div>
    </div>

    <!-- ========================= -->
    <!--        CZAT GRUPOWY       -->
    <!-- ========================= -->
    <div id="screen-group-chat" class="screen">
        <div class="card glass">

            <h2 id="group-chat-title"></h2>

            <div id="group-chat-messages" class="chat-box"></div>

            <input id="group-chat-input" placeholder="Wiadomość">
            <button onclick="sendGroupMessage()">Wyślij</button>

            <button onclick="goToScreen('screen-friends')">Powrót</button>

        </div>
    </div>

    <!-- ========================= -->
    <!--        SKRYPTY JS         -->
    <!-- ========================= -->

    <script src="data/lessons.js"></script>

    <script src="js/core.js"></script>
    <script src="js/lessons.js"></script>
    <script src="js/social.js"></script>

</body>
</html>
