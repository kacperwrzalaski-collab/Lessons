<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Language RPG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- STYLE -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- EKRAN LOGOWANIA -->
    <section id="screen-auth" class="screen">
        <div class="auth-box glass">
            <h1>Language RPG</h1>
            <input id="auth-username" placeholder="Nazwa użytkownika">
            <input id="auth-password" type="password" placeholder="Hasło">
            <button id="auth-login">Zaloguj</button>
            <button id="auth-register">Zarejestruj</button>
            <p id="auth-feedback"></p>
        </div>
    </section>

    <!-- GŁÓWNY APP CONTAINER -->
    <div id="app-container" class="hidden app-layout">

        <!-- SIDEBAR -->
        <aside id="sidebar" class="sidebar glass">
            <div class="profile-box">
                <div id="profile-avatar" class="avatar"></div>
                <div class="profile-info">
                    <div id="profile-name"></div>
                    <div id="profile-level"></div>
                    <div id="profile-xp-bar">
                        <div id="profile-xp-fill"></div>
                    </div>
                    <div id="profile-coins"></div>
                </div>
            </div>

            <nav class="nav-buttons">
                <button data-screen="screen-learn">📚 Nauka</button>
                <button data-screen="screen-flashcards">🃏 Fiszki</button>
                <button data-screen="screen-quiz">❓ Quiz</button>
                <button data-screen="screen-write">✍️ Pisanie</button>
                <button data-screen="screen-quests">🎯 Questy</button>
                <button data-screen="screen-shop">🛒 Sklep</button>
                <button data-screen="screen-inventory">🎒 Ekwipunek</button>
                <button data-screen="screen-settings">⚙️ Ustawienia</button>
            </nav>

            <button id="logout-btn" class="logout-btn">Wyloguj</button>
        </aside>

        <!-- MAIN CONTENT -->
        <main id="main-content" class="main-content glass">

            <!-- NAUKA -->
            <section id="screen-learn" class="screen">
                <h2>Nauka</h2>
                <select id="learn-topic-select"></select>
                <div id="learn-word-box"></div>
                <button id="learn-next">Następne słówko</button>
            </section>

            <!-- FISZKI -->
            <section id="screen-flashcards" class="screen hidden">
                <h2>Fiszki</h2>
                <select id="flashcards-topic-select"></select>
                <div id="flashcard-box">
                    <div id="flashcard-word"></div>
                    <div id="flashcard-answer" class="hidden"></div>
                </div>
                <button id="flashcard-show">Pokaż tłumaczenie</button>
                <button id="flashcard-next">Następna fiszka</button>
            </section>

            <!-- QUIZ -->
            <section id="screen-quiz" class="screen hidden">
                <h2>Quiz</h2>
                <select id="quiz-topic-select"></select>
                <div id="quiz-question-box">
                    <div id="quiz-question"></div>
                    <div id="quiz-options"></div>
                </div>
                <p id="quiz-feedback"></p>
            </section>

            <!-- PISANIE -->
            <section id="screen-write" class="screen hidden">
                <h2>Tryb pisania</h2>
                <select id="write-topic-select"></select>
                <div id="write-word-box">
                    <div id="write-question"></div>
                    <input id="write-answer" placeholder="Wpisz tłumaczenie...">
                    <button id="write-check">Sprawdź</button>
                </div>
                <p id="write-feedback"></p>
            </section>

            <!-- QUESTY -->
            <section id="screen-quests" class="screen hidden">
                <h2>Questy</h2>
                <div id="quests-list"></div>
            </section>

            <!-- SKLEP -->
            <section id="screen-shop" class="screen hidden">
                <h2>Sklep</h2>
                <div id="shop-items"></div>
            </section>

            <!-- EKWIPUNEK -->
            <section id="screen-inventory" class="screen hidden">
                <h2>Ekwipunek</h2>

                <h3>Odznaki</h3>
                <div id="inventory-badges"></div>

                <h3>Ramki</h3>
                <div id="inventory-frames"></div>

                <h3>Tła</h3>
                <div id="inventory-backgrounds"></div>

                <h3>Kolory przycisków</h3>
                <div id="inventory-buttons"></div>
            </section>

            <!-- USTAWIENIA -->
            <section id="screen-settings" class="screen hidden">
                <h2>Ustawienia</h2>
                <button id="admin-open">Panel administratora</button>
            </section>

        </main>
    </div>

    <!-- OKNO PROFILU -->
    <div id="profile-window" class="hidden glass profile-window">
        <h2>Twój profil</h2>

        <label>Avatar:</label>
        <input type="file" id="profile-avatar-upload">

        <label>Zmiana nazwy (100 XP Coins):</label>
        <input id="profile-new-name" placeholder="Nowa nazwa...">
        <button id="profile-change-name">Zmień nazwę</button>

        <label>Ramka avatara:</label>
        <select id="profile-frame-select"></select>

        <label>Tło:</label>
        <select id="profile-bg-select"></select>

        <label>Kolor przycisków:</label>
        <select id="profile-btn-select"></select>

        <button id="profile-save">Zapisz zmiany</button>
        <button id="profile-close">Zamknij</button>

        <p id="profile-feedback"></p>
    </div>

    <!-- OKNO LOGOWANIA DO ADMINA -->
    <div id="admin-login" class="hidden admin-login glass">
        <h3>Hasło administratora</h3>
        <input id="admin-password" type="password" placeholder="Wpisz hasło...">
        <button id="admin-login-btn">Zaloguj</button>
        <button id="admin-login-close">Zamknij</button>
        <p id="admin-login-feedback"></p>
    </div>

    <!-- PANEL ADMINA -->
    <div id="admin-panel" class="hidden admin-panel glass">
        <h2>Admin Panel</h2>
        <input id="admin-command" placeholder="Wpisz komendę...">
        <button id="admin-run">Wykonaj</button>
        <button id="admin-close">Zamknij panel</button>
        <p id="admin-output"></p>
    </div>

    <!-- PRESTIGE UP POPUP -->
    <div id="prestige-up" class="hidden prestige-popup glass">
        <h1 id="prestige-up-title"></h1>
        <p id="prestige-up-desc"></p>
        <button id="prestige-up-close">Zamknij</button>
    </div>

    <!-- SKRYPTY -->
    <script src="js/topics.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/learn.js"></script>
    <script src="js/flashcards.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/write.js"></script>
    <script src="js/quests.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/prestige.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
