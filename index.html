<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LERN ZONE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- EKRAN LOGOWANIA / REJESTRACJI -->
    <section id="screen-auth" class="screen-auth center-screen">
        <div class="auth-box glass">
            <h1 class="logo">LERN ZONE</h1>

            <div class="tabs">
                <button id="tab-login" class="active">Logowanie</button>
                <button id="tab-register">Rejestracja</button>
            </div>

            <div id="auth-login" class="auth-section active">
                <input id="login-username" placeholder="Login">
                <input id="login-password" type="password" placeholder="Hasło">
                <button id="btn-login">Zaloguj</button>
                <p id="login-feedback" class="feedback"></p>
            </div>

            <div id="auth-register" class="auth-section">
                <input id="register-username" placeholder="Login">
                <input id="register-password" type="password" placeholder="Hasło">
                <button id="btn-register">Utwórz konto</button>
                <p id="register-feedback" class="feedback"></p>
            </div>
        </div>
    </section>

    <!-- GŁÓWNA APLIKACJA -->
    <div id="app-container" class="hidden">

        <!-- SIDEBAR -->
        <aside class="sidebar glass">
            <div class="profile-box">
                <img id="profile-avatar" class="avatar" src="" alt="avatar">
                <div>
                    <h3 id="profile-name"></h3>
                    <p id="profile-level"></p>
                    <div class="xp-bar"><div id="xp-fill"></div></div>
                    <p>XP Coins: <span id="coins-display">0</span></p>
                </div>
            </div>

            <nav class="menu">
                <button data-screen="screen-learn">📘 Nauka słówek</button>
                <button data-screen="screen-flashcards">🃏 Fiszki</button>
                <button data-screen="screen-quiz">🎯 Quiz</button>
                <button data-screen="screen-write">⌨️ Pisanie odpowiedzi</button>
                <button data-screen="screen-quests">🎯 Questy</button>
                <button data-screen="screen-shop">🛒 Sklep</button>
                <button data-screen="screen-settings">⚙️ Ustawienia</button>
                <button id="btn-logout" class="logout">🚪 Wyloguj</button>
            </nav>
        </aside>

        <!-- CONTENT -->
        <main class="content">

            <!-- NAUKA SŁÓWEK -->
            <section id="screen-learn" class="screen active">
                <h2>Nauka słówek</h2>
                <div id="learn-topics" class="topics-list"></div>
                <ul id="learn-list"></ul>
            </section>

            <!-- FISZKI -->
            <section id="screen-flashcards" class="screen">
                <h2>Fiszki</h2>
                <select id="flash-topic"></select>
                <div class="flashcard glass">
                    <p id="flash-pl"></p>
                    <p id="flash-en" class="hidden"></p>
                </div>
                <button id="flash-show">Pokaż tłumaczenie</button>
                <button id="flash-next">Następne</button>
            </section>

            <!-- QUIZ -->
            <section id="screen-quiz" class="screen">
                <h2>Quiz</h2>
                <select id="quiz-topic"></select>
                <p id="quiz-question"></p>
                <div id="quiz-answers" class="quiz-answers"></div>
                <p id="quiz-feedback" class="feedback"></p>
                <p id="quiz-score"></p>
                <button id="quiz-next">Następne</button>
            </section>

            <!-- TRYB PISANIA -->
            <section id="screen-write" class="screen">
                <h2>Tryb pisania</h2>
                <select id="write-topic"></select>
                <p id="write-question"></p>
                <input id="write-input" placeholder="Wpisz tłumaczenie...">
                <button id="write-check">Sprawdź</button>
                <p id="write-feedback" class="feedback"></p>
                <p id="write-score"></p>
                <button id="write-next">Następne</button>
            </section>

            <!-- QUESTY -->
            <section id="screen-quests" class="screen">
                <h2>Questy</h2>
                <div id="quests-list"></div>
            </section>

            <!-- SKLEP -->
            <section id="screen-shop" class="screen">
                <h2>Sklep</h2>
                <p>Twoje XP Coins: <span id="coins-display-shop">0</span></p>

                <h3>Przedmioty</h3>
                <div id="shop-items"></div>

                <h3>Lootboxy</h3>
                <div id="lootbox-list"></div>
            </section>

            <!-- USTAWIENIA -->
            <section id="screen-settings" class="screen">
                <h2>Ustawienia</h2>

                <label>Avatar:</label>
                <input type="file" id="avatar-upload">

                <label>Motyw:</label>
                <button id="theme-toggle">Przełącz motyw</button>

                <label>Tryb wyświetlania:</label>
                <select id="display-mode">
                    <option value="pc">Komputer</option>
                    <option value="mobile">Telefon</option>
                </select>
            </section>

        </main>
    </div>

    <!-- ANIMACJA LOOTBOXA -->
    <div id="lootbox-opening" class="lootbox-overlay hidden">
        <div class="lootbox-box">
            <div class="lootbox-animation"></div>
            <h2 id="lootbox-result-name"></h2>
            <button id="lootbox-close">Zamknij</button>
        </div>
    </div>

    <!-- SKRYPTY -->
    <script src="js/topics.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/quests.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
